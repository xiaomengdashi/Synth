<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="never">
    <title>SynthAI · 个人知识库</title>
    <script>
      // 在 HTML 头部尽早执行，防止页面加载时出现白屏或暗色闪烁。
      // 主题 id 清单见 src/features/app/themes.ts,两处需同步;旧值 'dark'/'light' 做迁移。
      (function () {
        var saved = localStorage.getItem('theme');
        var darkIds = { moye: 1, dianqing: 1 };
        var lightIds = { zhimo: 1, qingci: 1 };
        var legacy = { qiushi: 'zhimo', subai: 'zhimo', daizi: 'moye' };
        var id, dark;
        if (saved && legacy[saved]) saved = legacy[saved];
        if (saved && (lightIds[saved] || darkIds[saved])) {
          id = saved; dark = !!darkIds[saved];
        } else if (saved === 'light') {
          id = 'zhimo'; dark = false;
        } else {
          id = 'moye'; dark = true; // 'dark'、无值、未知值:默认墨夜
        }
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.theme = id;
      })();
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
